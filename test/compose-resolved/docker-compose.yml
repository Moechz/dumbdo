# ===========================================================================
# DumbDo for TerraMaster TOS 7 (Docker application)
# ===========================================================================
# Upstream image : dumbwareio/dumbdo:d4dff81e4eab16de0974a94742e1cd3bc51a369a
#                  (Docker Hub, official multi-arch image, used unmodified)
#                  -> https://github.com/DumbWareio/DumbDo
#
# Ports   : host 8163 -> container 3000. The host port is in the
#           TOS-recommended 8000-19999 range and is not one of the reserved
#           ports (22/80/443/445/3306/5050/5432/6379/8181/8443).
# Volumes : all persistent data lives below
#           /Volume1/DockerAppData/dumbdodocker/. The /Volume* wildcard is
#           deliberately NOT used: the platform does not expand it.
# TOS rules honoured: Docker Hub image with a fixed tag (never ':latest'),
#           container_name == application id, restart: unless-stopped,
#           non-root user, no privileged mode, no network_mode: host, no
#           cap_add, explicit TZ, a healthcheck on the only service, and
#           x-app-meta as the last block.
# Wrapper : the upstream image runs as root and may own /app as root; the
#           entrypoint below runs as uid 1000, copies only the small code
#           files into /data/app, reuses node_modules by symlink and keeps
#           the todo data on the volume.
# Escaping: docker compose interpolates ${VAR}/$VAR in compose files, so any
#           '$' meant for the shell is written '$$'.
#
# NOTE for maintainers: never place a comment line directly in front of a
# "- value" sequence item (ports, volumes, ...). The official
# TOSAppSelfTestingTool parses the compose file line by line; a comment inside
# a sequence makes it skip its permission sync, the mounted directories stay
# root-owned and the non-root container cannot write into them.

services:
  dumbdodocker:
    image: dumbwareio/dumbdo:d4dff81e4eab16de0974a94742e1cd3bc51a369a
    container_name: dumbdodocker
    restart: unless-stopped
    user: "1000:1000"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        #!/bin/sh
        # ===========================================================================
        # TOS wrapper for DumbDo.
        # ===========================================================================
        # The upstream image may be built with /app owned by root, so a non-root
        # container cannot write into the image tree. DumbDo only writes its data/
        # directory and the generated PWA assets under public/assets, so copy the
        # small application code (server.js, package.json, scripts/, public/) into
        # /data/app and reuse the image's node_modules through a symlink. Copying the
        # full ~250 MB application tree on first start is what made the aarch64
        # installation test time out; that copy is gone.
        #
        # Data written by 2026.11.14-2 lived in /data/app/data/todos.json because that
        # version ran a full copy of the app from the volume. Migrate it once, then
        # point the app's data directory at the volume root.
        # ===========================================================================
        set -u
        set -e

        mkdir -p /data/app

        if [ -f /data/app/data/todos.json ] && [ ! -f /data/todos.json ]; then
          cp /data/app/data/todos.json /data/todos.json
        fi

        cp /app/server.js /app/package.json /data/app/
        rm -rf /data/app/scripts /data/app/public
        cp -R /app/scripts /data/app/scripts
        cp -R /app/public /data/app/public
        rm -rf /data/app/node_modules
        ln -s /app/node_modules /data/app/node_modules

        # server.js resolves its data directory relative to the application root.
        rm -rf /data/app/data
        ln -s /data /data/app/data

        cd /data/app
        exec node server.js
    ports:
      - "8163:3000"
    environment:
      TZ: "Asia/Shanghai"
    volumes:
      - /Volume1/DockerAppData/dumbdodocker/data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

# TOS App Center web metadata (must be the last block of the file):
# web.port is the published host port above, protocol is http.
x-app-meta:
  web:
    port: 8163
    protocol: http
